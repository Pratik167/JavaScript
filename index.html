<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <style>
#box{
    position: relative;
    border: 5px solid;
    width: 100%;
    aspect-ratio: 2/1;
    text-align: center;
}
#game{
    font-size: 30px;
}


#button{
    position: absolute;
    width: 100px;
    aspect-ratio: 1/1;
    margin-left: 10px;
    cursor: pointer;
    left: 45%;
    top: 300px;
}
.fire{
    width: 100%;
    height: 100%;
    object-fit: fill;
}


#counter{
    position: absolute;
    width: 100px;
    aspect-ratio: 1/1;
    border: 4px solid;
    margin-left: 10px;
    left: 45%;
    top: 100px;
    font-size: 80px;
    text-align: center;
}


#reset{
    position:absolute;
    width: 100px;
    height: 25px;
    border: 2px solid;
    left: 45%;
    margin-left: 10px;
    top: 240px;
    text-align: center;
    font-size: 20px;
    cursor: pointer;
}


#speed{
    position: absolute;
    width: 300px;
    aspect-ratio: 1/1;
    margin-left: 10px;
    cursor: pointer;
    left: 70%;
    top: 100px;
}
.ishowspeed{
    width: 100%;
    height: 100%;
    object-fit: fill;
}
    </style>

</head>
<body>
    <div id="box"><p id="game">Game Box</p></div>


    <div id ="counter">0</div>


    <div id="button"> 
        <img class="fire"src="https://media.istockphoto.com/id/1375132290/vector/fire-flame-emoji-vector-illustration.jpg?s=612x612&w=0&k=20&c=s2LncE69x_3rYAqvNwBGbuDWUq-A2Z9TOXPGIWA0G_g=">
    </div>


    <div id="reset">Reset</div>


    <div id="speed"><img class="ishowspeed"src="https://media.tenor.com/bkl4kbX9g8EAAAAe/speedddd.png"></div>


    <script>
        const box= document.getElementById("box");
        let button=document.getElementById("button");
        button.addEventListener("click",playMusic);
        const counter=document.getElementById("counter");
        let count=1;
        function playMusic(){
            let audio= new Audio("1.mp3");
                audio.play();
            counter.textContent=count;
            count++;
        }
        
        const reset=document.getElementById("reset");
        reset.addEventListener("mousedown",function(){
            count=0;
            counter.textContent=count;
        })
        reset.addEventListener("mouseup",function(){
            count=1;
        })
        const speed=document.getElementById("speed");
        speed.addEventListener("click",meme)
        function meme(){
            let audio = new Audio("speed.MP3");
            audio.play();
        }
        
    </script>
</body>
</html>
